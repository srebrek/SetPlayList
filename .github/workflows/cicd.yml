name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrsrebrek
  ACR_LOGIN_SERVER: acrsrebrek.azurecr.io
  CONTAINER_APP_NAME: setplaylist
  RESOURCE_GROUP: rg-setplaylist

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Azure login (federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish container image to ACR
        run: |
          token=$(az acr login --name "$ACR_NAME" --expose-token --query accessToken --output tsv)
          SDK_CONTAINER_REGISTRY_UNAME=00000000-0000-0000-0000-000000000000 \
          SDK_CONTAINER_REGISTRY_PWORD="$token" \
          dotnet publish src/SetPlayList/SetPlayList.csproj \
            --no-restore \
            --configuration Release \
            -p:PublishProfile=DefaultContainer \
            -p:ContainerRegistry=$ACR_LOGIN_SERVER \
            -p:ContainerImageTags='"${{ github.sha }};latest"'

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/setplaylist:${{ github.sha }}" \
            --output none

      - name: Smoke test
        run: |
          fqdn=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          for _ in $(seq 1 20); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 30 "https://$fqdn/health" || true)

            if [ "$status" = "200" ]; then
              echo "Healthy: https://$fqdn"
              exit 0
            fi

            sleep 10
          done

          echo "Health check failed, last status: $status"
          exit 1
